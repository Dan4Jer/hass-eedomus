# tickets.toml — epic-eedomus-simulator : 5 entrées, ordre de build.

[[entry]]
id = 1
type = "story"
title = "Salvage du simulateur (PR #119)"
description = "Import du simulateur d'API eedomus depuis la PR #119 dans scripts/simulateur/ — simulator.py (Flask : auth.test, periph.list, periph.value_list, periph.caract, periph.value, /simulate/change, règles thermostat), scripts d'extraction/renommage/anonymisation (00/01/02), README — traduit en anglais (AGENTS.md), crédit fmo01 dans les commits. Dump fmo01 (69 periphs) commité après la passe de vie privée complète. Flask ajouté à requirements-test uniquement. Tests unitaires du simulateur : contrats d'endpoints contre les attentes d'eedomus_client, auth ok/ko, règles thermostat, multi-instances sur ports distincts."
verify = "La config flow de HA (harnais de test ou requête directe) valide la connexion au simulateur et les endpoints répondent conformes au client ; la suite unitaire reste verte ; le dump commité a passé la passe de vie privée."
covers = ["CAP-1", "CAP-5"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Endpoint periph.history synthétique"
description = "Ajout de l'endpoint periph.history au simulateur : historique généré depuis le dump (points horaires sur N années, densité paramétrable), chunking/pagination conformes au client (≤ 10 000 points/appel, sémantique de reprise du client), déterministe (même dump + même ancrage temporel = même historique, aucun temps muré). Tests unitaires : déterminisme, bornes de chunk, pagination, periphs sans historique."
verify = "Le client d'intégration (chemin production, sans modification) pagine l'historique complet d'un periph du dump sans erreur et le total de points est stable entre deux exécutions à ancrage identique."
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "medium"
unknown = "Profondeur N et densité : à fixer au premier E2E backfill mesuré (entrée 5) — l'endpoint est paramétrable pour ne pas bloquer."

