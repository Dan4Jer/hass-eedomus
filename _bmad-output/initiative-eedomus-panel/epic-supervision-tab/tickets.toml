# tickets.toml — epic-supervision-tab : 5 entrées, ordre de build.

[[entry]]
id = 1
type = "story"
title = "Commandes websocket de la file de backfill (état + 4 actions)"
description = "Backend : une commande d'état (file par périphérique : en attente/position, en cours, en erreur avec message et retry_after, ignoré, en pause ; état global du moteur) et les quatre actions — réessayer maintenant (hors cadence), prioriser (tête de file au prochain drain), pause/reprise par périphérique + interrupteur global, ignorer (persisté en .storage, réactivable) — via le dispatcher ui_service (require_admin) ; toutes passent par le coordinator (AD-7), jamais d'appel direct à l'API eedomus ; la file et les actions respectent AD-2 (tâche de fond, un importer actif)."
verify = "Tests unitaires : état complet dérivé du coordinator, chaque action produit l'effet attendu sur la file, l'ignorage survit à une réinstanciation (persistance), la pause globale stoppe le drain sans casser la reprise ; les contrats gelés restent verts."
covers = ["CAP-5"]
after = []
hitl = false
risk = "medium"
unknown = "La persistance de l'ignorage et de la pause (extension des clés .storage existantes du backfill) se calque sur la progression déjà persistée — à préciser au plan_checkpoint."
plan_checkpoint = true

