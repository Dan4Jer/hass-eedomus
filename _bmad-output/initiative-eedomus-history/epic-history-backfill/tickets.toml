[[entry]]
id = 9
type = "story"
title = "Run périodique de re-compare cloud et ré-intégration (joint + corrections tardives)"
description = "Le backfill actuel est un walk unique : un periph completed n'est jamais re-fetché (« already fully imported »). Les heures post-natives appartiennent au recorder HA (AD-11, couvert sans code), mais deux fenêtres restent sans mécanisme : le joint entre la dernière heure backfillée et la première statistique native, et les corrections/ajouts tardifs du cloud sur la fenêtre pré-native. Ce run périodique re-compare le cloud et ré-intègre les écarts — sûr par construction (upsert idempotent CAP-3, clip AD-11 jamais violé). Périmètre exact à trancher à la planification : sondage du joint seul (léger) vs re-walk complet (lourd), fréquence, et s'il ne couvre que les periphs eligible non complétés ou aussi les completed."
verify = "Une correction injectée côté cloud (ou un point du joint manquant) est détectée au passage du run et atterrit dans les statistics de l'entité sans dupliquer les heures natives ; le run ne bouffe pas le quota du drain initial (les periphs pending du premier backfill restent prioritaires)."
covers = []
after = [4]
hitl = false
risk = "medium"
notes = ["Sujet issu de la session d'elicitation du 2026-10-10 (l'utilisateur a codé l'initialisation, pas le run). Terrain factuel vérifié dans le code : walk unique, completed jamais re-fetché, recorder = vérité post-native, upsert idempotent.", "Inconnu à trancher avant build : le cloud eedomus corrige-t-il réellement des heures anciennes, et à quelle fréquence ? Si non, le run se réduit au sondage du joint.", "Antagonisme à surveiller : le bug de la boucle de fetch infinie (periphs completed re-fetchant la même fenêtre) — le design du run ne doit pas la reproduire sur les completed."]

[[entry]]
id = 10
type = "bug"
title = "Boucle de fetch infinie : periphs arrives a present sans jamais passer completed"
description = "Quand le walk d'un gros periph atteint present, la fenetre API [start, now] renvoie toujours exactement 10 000 points (les plus recents du cloud) dont le max = le dernier point cloud (~30 min de retard) : last_timestamp n'avance plus, le periph re-fetch la meme fenetre a chaque passe sans jamais passer completed (len(chunk) < 10000), le quota du drain est bouffe en continu par 5-6 periphs (observe live : 1248341, 1091579, 1077374, 1123009, 1090997 en boucle depuis des heures, retrieved_points qui enfle de 10k/passe). Fix attendu : detecter la fenetre morte (chunk plein dont max <= start precedent, ou comparaison au premier native statistic AD-11) et marquer completed."
verify = "Sur l'instance live, les periphs precedemment en boucle passent completed et quittent la file ; le drain consacre son quota a des periphs qui progressent reellement ; aucun test unitaire de regression casse."
covers = ["CAP-2"]
after = [4]
hitl = false
risk = "medium"
notes = ["Diagnostique 2026-10-09 dans l'analyse des logs (session live). Ne pas reproduire ce comportement dans le simulateur (5.2 l'exclut deja : points strictement apres start)."]

[[entry]]
