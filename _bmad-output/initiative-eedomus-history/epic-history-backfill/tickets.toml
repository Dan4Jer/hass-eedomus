verify = "Aucun warning 'no exact entity match' sur un cycle de drain complet ; les periphs concernes soit importent dans leur entite reelle, soit sont absents de la file get_backfill_state."
covers = ["CAP-1"]
after = [4]
hitl = false
risk = "medium"
notes = ["Diagnostique 2026-10-09 : les suffixes _2 des entites sont la cause la plus probable (registry unique_id <prefix>_<periph_id> exact mais entity_id suffixe). Decision allow_suffixed vs exclusion a prendre a la planification."]
