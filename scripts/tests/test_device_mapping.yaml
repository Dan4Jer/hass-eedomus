# --- 4. Tests merge_yaml_mappings ---


def test_merge_yaml_mappings_invalid_inputs():
    """Vérifie que la fonction gère des entrées non-dictionnaires sans crasher."""
    result = merge_yaml_mappings(None, "invalid_type")  # type: ignore
    assert isinstance(result, dict)
    assert result["usage_id_mappings"] == {}
    assert result["advanced_rules"] == []


def test_merge_yaml_mappings_advanced_rules_and_dynamic_extraction():
    """Vérifie la conversion d'advanced_rules en dict et l'extraction des dynamic_props."""
    default = {
        "advanced_rules": [
            {
                "name": "rgbw_rule",
                "mapping": {"is_dynamic": True, "ha_entity": "light"},
            },
            {
                "name": "static_rule",
                "mapping": {"is_dynamic": False, "ha_entity": "switch"},
            },
        ],
        "dynamic_entity_properties": {"climate": {}},
    }
    custom = {}

    merged = merge_yaml_mappings(default, custom)

    # Vérification de la création d'advanced_rules_dict
    assert "rgbw_rule" in merged["advanced_rules_dict"]
    assert "static_rule" in merged["advanced_rules_dict"]

    # Vérification de l'extraction dynamic_entity_properties (light extrait + climate existant)
    assert merged["dynamic_entity_properties"]["light"] is True
    assert "climate" in merged["dynamic_entity_properties"]


def test_merge_yaml_mappings_custom_overrides():
    """Vérifie le remplacement/extension de la configuration par les surcharges personnalisées."""
    default = {
        "usage_id_mappings": {"1": {"ha_entity": "switch"}},
        "name_patterns": [{"pattern": "lamp"}],
        "dynamic_entity_properties": {"switch": {}},
        "specific_device_dynamic_overrides": {"100": {"ha_entity": "switch"}},
        "specific_device_mappings": {"200": {"ha_entity": "cover"}},
        "metadata": {"version": "1.0.0"},
    }

    custom = {
        "custom_usage_id_mappings": {"1": {"ha_entity": "light"}},
        "custom_name_patterns": [{"pattern": "fan"}],
        "custom_dynamic_entity_properties": {"light": {}},
        "custom_specific_device_dynamic_overrides": {"100": {"ha_entity": "climate"}},
        "custom_specific_device_mappings": {"300": {"ha_entity": "lock"}},
        "metadata": {"version": "1.1.0_custom"},
    }

    merged = merge_yaml_mappings(default, custom)

    assert merged["usage_id_mappings"]["1"]["ha_entity"] == "light"
    assert len(merged["name_patterns"]) == 2
    assert "light" in merged["dynamic_entity_properties"]
    assert merged["specific_device_dynamic_overrides"]["100"]["ha_entity"] == "climate"
    assert "200" in merged["specific_device_mappings"]
    assert "300" in merged["specific_device_mappings"]
    assert merged["metadata"]["version"] == "1.1.0_custom"


# --- 5. Tests load_yaml_mappings & load_yaml_mappings_async ---


def test_load_yaml_mappings_with_base_path():
    """Vérifie le chargement synchrone complet avec un base_path spécifique."""
    mock_default = {"usage_id_mappings": {"1": {"ha_entity": "switch"}}}
    mock_custom = {"custom_usage_id_mappings": {"1": {"ha_entity": "light"}}}

    def side_effect(filepath):
        if CUSTOM_MAPPING_FILE in filepath:
            return mock_custom
        return mock_default

    with patch("os.path.exists", return_value=True), patch(
        "custom_components.eedomus.device_mapping.load_yaml_file",
        side_effect=side_effect,
    ):
        merged = load_yaml_mappings(base_path="/custom/path")
        assert merged["usage_id_mappings"]["1"]["ha_entity"] == "light"


@pytest.mark.asyncio
async def test_load_yaml_mappings_async(mock_hass):
    """Vérifie le chargement asynchrone des mappings sans base_path (chemins absolus)."""
    mock_default = {"dynamic_entity_properties": {"switch": {}}}
    mock_custom = {}

    def side_effect(hass, filepath):
        if CUSTOM_MAPPING_FILE in filepath:
            return mock_custom
        return mock_default

    with patch("os.path.exists", return_value=True), patch(
        "custom_components.eedomus.device_mapping.load_yaml_file_async",
        side_effect=side_effect,
    ):
        merged = await load_yaml_mappings_async(mock_hass)
        assert "switch" in merged["dynamic_entity_properties"]


# --- 6. Tests load_and_merge_yaml_mappings ---

def test_load_and_merge_yaml_mappings_success():
    """Vérifie le pipeline complet de chargement/fusion avec métadonnées et logs."""
    mock_base = {
        "usage_id_mappings": {"1": {"ha_entity": "switch"}},
        "dynamic_entity_properties": {"switch": {}},
        "specific_device_dynamic_overrides": {},
        "metadata": {"version": "2.0", "last_modified": "2026-01-01"},
    }
    mock_custom = {
        "custom_specific_device_dynamic_overrides": {
            "3463520": {"ha_entity": "climate"}
        }
    }

    def mock_load_yaml(filepath):
        filepath_str = str(filepath)
        if "custom_mapping.yaml" in filepath_str:
            return mock_custom
        return mock_base

    with patch("os.path.exists", return_value=True), patch(
        "custom_components.eedomus.device_mapping.load_yaml_file",
        side_effect=mock_load_yaml,
    ):
        result = load_and_merge_yaml_mappings()

        assert "usage_id_mappings" in result
        assert "specific_device_dynamic_overrides" in result
        assert (
            result["specific_device_dynamic_overrides"]["3463520"]["ha_entity"]
            == "climate"
        )


def test_load_and_merge_yaml_mappings_empty_fallback():
    """Vérifie la génération de la configuration minimale lorsque le retour est vide."""
    with patch(
        "custom_components.eedomus.device_mapping.load_yaml_mappings",
        return_value={},
    ):
        result = load_and_merge_yaml_mappings()
        assert "_load_error" in result
        assert result["default_mapping"]["ha_entity"] == "sensor"


def test_load_and_merge_yaml_mappings_exception_fallback():
    """Vérifie la capture d'exception et le fallback sur erreur critique."""
    with patch(
        "custom_components.eedomus.device_mapping.load_yaml_mappings",
        side_effect=RuntimeError("Fatal error reading files"),
    ):
        result = load_and_merge_yaml_mappings()
        assert "_load_error" in result
        assert "Fatal error reading files" in result["_load_error"]
        assert result["default_mapping"]["ha_entity"] == "sensor"


