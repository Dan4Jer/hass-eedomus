"""Tests unitaires complets pour le module device_mapping d'eedomus."""

import os
from unittest.mock import AsyncMock, MagicMock, mock_open, patch
import pytest
import yaml

from custom_components.eedomus.device_mapping import (
    CUSTOM_MAPPING_FILE,
    DEFAULT_MAPPING_FILE,
    get_absolute_path,
    load_and_merge_yaml_mappings,
    load_custom_yaml_mappings,
    load_custom_yaml_mappings_async,
    load_yaml_file,
    load_yaml_file_async,
    load_yaml_mappings,
    load_yaml_mappings_async,
    merge_yaml_mappings,
)


@pytest.fixture
def mock_hass():
    """Fixture simulant l'instance Home Assistant pour les fonctions asynchrones."""
    hass = MagicMock()

    async def mock_executor(target, *args, **kwargs):
        return target(*args, **kwargs)

    hass.async_add_executor_job = AsyncMock(side_effect=mock_executor)
    return hass


# --- 1. Test get_absolute_path ---


def test_get_absolute_path():
    """Vérifie le calcul des chemins absolus relatifs au module."""
    rel_path = "config/test.yaml"
    abs_path = get_absolute_path(rel_path)

    assert os.path.isabs(abs_path)
    assert abs_path.endswith(os.path.join("config", "test.yaml"))


# --- 2. Tests load_yaml_file (Synchrone) ---


def test_load_yaml_file_success():
    """Vérifie le chargement réussi d'un dictionnaire YAML."""
    yaml_data = "usage_id_mappings:\n  '1':\n    ha_entity: 'switch'\n"
    with patch("os.path.exists", return_value=True), patch(
        "builtins.open", mock_open(read_data=yaml_data)
    ):
        result = load_yaml_file("/fake/path.yaml")
        assert result == {"usage_id_mappings": {"1": {"ha_entity": "switch"}}}


def test_load_yaml_file_list_format():
    """Vérifie la conversion automatique si le fichier YAML est une liste."""
    yaml_data = "- name: rule_1\n  mapping:\n    ha_entity: light\n"
    with patch("os.path.exists", return_value=True), patch(
        "builtins.open", mock_open(read_data=yaml_data)
    ):
        result = load_yaml_file("/fake/path.yaml")
        assert isinstance(result, dict)
        assert "advanced_rules" in result
        assert result["advanced_rules"] == [
            {"name": "rule_1", "mapping": {"ha_entity": "light"}}
        ]
        assert result["usage_id_mappings"] == {}


def test_load_yaml_file_not_found():
    """Vérifie que la fonction renvoie None si le fichier n'existe pas."""
    with patch("os.path.exists", return_value=False):
        result = load_yaml_file("/fake/non_existent.yaml")
        assert result is None


def test_load_yaml_file_empty():
    """Vérifie le comportement avec un fichier YAML vide."""
    with patch("os.path.exists", return_value=True), patch(
        "builtins.open", mock_open(read_data="")
    ):
        result = load_yaml_file("/fake/empty.yaml")
        assert result is None


def test_load_yaml_file_syntax_error():
    """Vérifie la gestion des erreurs de syntaxe YAML (YAMLError)."""
    invalid_yaml = "key: [unclosed_list"
    with patch("os.path.exists", return_value=True), patch(
        "builtins.open", mock_open(read_data=invalid_yaml)
    ):
        result = load_yaml_file("/fake/invalid.yaml")
        assert result is None


def test_load_yaml_file_permission_error():
    """Vérifie la gestion des exceptions génériques d'E/S."""
    with patch("os.path.exists", return_value=True), patch(
        "builtins.open", side_effect=PermissionError("Access denied")
    ):
        result = load_yaml_file("/fake/protected.yaml")
        assert result is None


# --- 3. Tests load_yaml_file_async (Asynchrone) ---


@pytest.mark.asyncio
async def test_load_yaml_file_async_success(mock_hass):
