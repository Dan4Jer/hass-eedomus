name: Run Tests

on:
  push:
    branches:
      - main
      - unstable
    paths:
      - "custom_components/**"
      - "scripts/tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yaml"

  pull_request:
    branches:
      - main
      - unstable
    paths:
      - "custom_components/**"
      - "scripts/tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yaml"

  workflow_dispatch:

jobs:
  test:
    name: Tests hass-eedomus
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show test environment
        run: |
          python --version
          python -m pytest --version
          python -m pip show pytest-cov
          python -m pip show pytest-homeassistant-custom-component

      - name: Run tests with coverage
        run: |
          python3 -m pytest \
            scripts/tests/ \
            -v \
            --tb=short \
            --cov=custom_components/eedomus \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()

          rate = float(root.attrib.get("line-rate", 0))
          lines_valid = int(root.attrib.get("lines-valid", 0))
          lines_covered = int(root.attrib.get("lines-covered", 0))
          lines_missing = lines_valid - lines_covered

          print()
          print("========================================")
          print(" hass-eedomus coverage")
          print("========================================")
          print(f"Statements : {lines_valid}")
          print(f"Covered    : {lines_covered}")
          print(f"Missing    : {lines_missing}")
          print(f"Coverage   : {rate * 100:.2f}%")
          print("========================================")
          PY
          else
            echo "coverage.xml not generated"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14
