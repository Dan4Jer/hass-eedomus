name: Run Tests

on:
  push:
    branches:
      - main
      - unstable
    paths:
      - "custom_components/**"
      - "scripts/tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yaml"

  pull_request:
    branches:
      - main
      - unstable
    paths:
      - "custom_components/**"
      - "scripts/tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yaml"

  workflow_dispatch:

jobs:
  test:
    name: Tests hass-eedomus
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show test environment
        run: |
          python --version
          python -m pytest --version
          python -m pip show pytest-cov
          python -m pip show pytest-homeassistant-custom-component
          python -m pip show async-timeout

      - name: Run tests with coverage
        run: |
          python3 -m pytest \
            scripts/tests/ \
            -v \
            --tb=short \
            --junitxml=pytest-results.xml \
            --cov=custom_components/eedomus \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Generate coverage summary
        if: success()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("coverage.xml").getroot()

          rate = float(root.attrib.get("line-rate", 0))
          lines_valid = int(root.attrib.get("lines-valid", 0))
          lines_covered = int(root.attrib.get("lines-covered", 0))
          lines_missing = lines_valid - lines_covered

          coverage = rate * 100

          content = f"""# Test coverage

          Current automated coverage:

          - Statements: {lines_valid}
          - Covered: {lines_covered}
          - Missing: {lines_missing}
          - Coverage: **{coverage:.2f}%**

          Generated automatically by GitHub Actions.
          """

          Path("coverage-summary.md").write_text(
              content,
              encoding="utf-8",
          )

          print(content)
          PY

      - name: Update README test statistics
        if: success()
        run: |

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          # =========================================================
          # Date / heure Europe/Paris
          # =========================================================

          run_date = datetime.now(
              ZoneInfo("Europe/Paris")
          ).strftime("%Y-%m-%d %H:%M:%S Europe/Paris")

          # =========================================================
          # Coverage globale
          # =========================================================

          coverage_root = ET.parse("coverage.xml").getroot()

          rate = float(coverage_root.attrib.get("line-rate", 0))
          statements = int(coverage_root.attrib.get("lines-valid", 0))
          covered = int(coverage_root.attrib.get("lines-covered", 0))
          missing = statements - covered
          coverage = rate * 100

          # =========================================================
          # Résultats pytest
          # =========================================================

          junit_root = ET.parse("pytest-results.xml").getroot()

          if junit_root.tag == "testsuites":
              suites = junit_root.findall("testsuite")
          else:
              suites = [junit_root]

          tests = sum(
              int(x.attrib.get("tests", 0))
              for x in suites
          )

          failures = sum(
              int(x.attrib.get("failures", 0))
              for x in suites
          )

          errors = sum(
              int(x.attrib.get("errors", 0))
              for x in suites
          )

          skipped = sum(
              int(x.attrib.get("skipped", 0))
              for x in suites
          )

          passed = tests - failures - errors - skipped

          # =========================================================
          # Lecture README
          # =========================================================

          readme = Path("scripts/tests/README.md")
          content = readme.read_text(encoding="utf-8")

          # =========================================================
          # Bloc Current test status
          # =========================================================

          status_block = f"""<!-- TEST-STATS-START -->
          - Tests: **{passed} passed**
          - Statements: **{statements}**
          - Covered: **{covered}**
          - Missing: **{missing}**
          - Coverage: **{coverage:.2f}%**
          <!-- TEST-STATS-END -->"""

          content, count = re.subn(
              r"<!-- TEST-STATS-START -->.*?<!-- TEST-STATS-END -->",
              status_block,
              content,
              flags=re.DOTALL,
          )

          if count != 1:
              raise SystemExit(
                  "TEST-STATS block not found or duplicated"
              )

          # =========================================================
          # Couverture par module
          # =========================================================

          modules = []

          for class_node in coverage_root.findall(".//class"):

              filename = class_node.attrib.get("filename", "")

              if not filename.endswith(".py"):
                  continue

              # Nom affiché dans le README
              module_name = Path(filename).name

              lines = class_node.findall("./lines/line")

              module_statements = len(lines)

              module_covered = sum(
                  1
                  for line in lines
                  if int(line.attrib.get("hits", "0")) > 0
              )

              module_missing = (
                  module_statements - module_covered
              )

              if module_statements:
                  module_coverage = (
                      module_covered
                      / module_statements
                      * 100
                  )
              else:
                  module_coverage = 100.0

              modules.append(
                  (
                      module_name,
                      module_statements,
                      module_missing,
                      module_coverage,
                  )
              )

          # Tri alphabétique
          modules.sort(key=lambda item: item[0].lower())

          # =========================================================
          # Création tableau Markdown
          # =========================================================

          table = [
              "<!-- COVERAGE-MODULES-START -->",
              f"Last update: **{run_date}**",
              "",
              "| Component | Statements | Missed | Coverage |",
              "|---|---:|---:|---:|",
          ]

          for (
              module_name,
              module_statements,
              module_missing,
              module_coverage,
          ) in modules:

              table.append(
                  f"| `{module_name}` "
                  f"| {module_statements} "
                  f"| {module_missing} "
                  f"| {module_coverage:.2f}% |"
              )

          table.append(
              f"| **TOTAL** "
              f"| **{statements}** "
              f"| **{missing}** "
              f"| **{coverage:.2f}%** |"
          )

          table.append(
              "<!-- COVERAGE-MODULES-END -->"
          )

          coverage_block = "\n".join(table)

          # =========================================================
          # Remplacement tableau README
          # =========================================================

          content, count = re.subn(
              r"<!-- COVERAGE-MODULES-START -->"
              r".*?"
              r"<!-- COVERAGE-MODULES-END -->",
              coverage_block,
              content,
              flags=re.DOTALL,
          )

          if count != 1:
              raise SystemExit(
                  "COVERAGE-MODULES block not found or duplicated"
              )

          # =========================================================
          # Sauvegarde
          # =========================================================

          readme.write_text(
              content,
              encoding="utf-8",
          )

          print()
          print("README updated")
          print("=" * 50)
          print(f"Tests      : {passed}")
          print(f"Statements : {statements}")
          print(f"Covered    : {covered}")
          print(f"Missing    : {missing}")
          print(f"Coverage   : {coverage:.2f}%")
          print(f"Modules    : {len(modules)}")
          print(f"Run date   : {run_date}")
          print("=" * 50)
          PY

      - name: Commit README coverage update
        if: success() && github.event_name == 'push'
        run: |
          if git diff --quiet scripts/tests/README.md; then
            echo "README already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/tests/README.md
          git commit -m "docs: update test coverage [skip ci]"

          echo "Refreshing remote branch before push..."
          git fetch origin "${GITHUB_REF_NAME}"

          git rebase "origin/${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage summary
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.md
          retention-days: 30

