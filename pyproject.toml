[tool.black]
line-length = 88
target-version = ['py39']
exclude = '''
/(
    \.git
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["custom_components"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
# ... autres configurations ...
asyncio_mode = "auto"
norecursedirs = ["docs", "env_eedom", ".git", ".github", ".venv", "scripts/tests/archive"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
omit = [
    "custom_components/eedomus/script_de_migration_universel.py",
]
