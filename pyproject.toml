[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-eedomus"
version = "0.15.3"
dependencies = [
    "aiohttp==3.14.3",
    "requests==2.34.2",
    "yarl==1.25.1",
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["custom_components"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests against the live Home Assistant instance (deselect with '-m \"not e2e\"')",
    "unit: fast local unit tests",
    "integration: integration tests with mocked HA",
]
timeout = 300
